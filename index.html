<script>

const countryCities = {

"Slovensko":[
"Bratislava",
"Kosice",
"Presov",
"Zilina",
"Nitra",
"Trnava",
"Banska Bystrica",
"Poprad"
],

"Česko":[
"Praha",
"Brno",
"Ostrava",
"Plzen",
"Liberec",
"Olomouc"
],

"Poľsko":[
"Warszawa",
"Krakow",
"Gdansk",
"Poznan",
"Wroclaw"
],

"Maďarsko":[
"Budapest",
"Debrecen",
"Szeged",
"Pecs",
"Gyor"
],

"Rakúsko":[
"Vieden",
"Graz",
"Linz",
"Salzburg",
"Innsbruck"
],

"Nemecko":[
"Berlin",
"Munich",
"Hamburg",
"Frankfurt",
"Koln"
],

"Taliansko":[
"Rim",
"Milano",
"Neapol",
"Turin",
"Bologna"
],

"Francúzsko":[
"Pariz",
"Lyon",
"Marseille",
"Toulouse",
"Nice"
],

"Belgicko":[
"Brusel",
"Antverpy",
"Gent",
"Liege"
],

"Holandsko":[
"Amsterdam",
"Rotterdam",
"Eindhoven",
"Utrecht"
]

};

function loadCities(countryId, cityId){

const country =
document.getElementById(countryId).value;

const citySelect =
document.getElementById(cityId);

citySelect.innerHTML = "";

countryCities[country].forEach(city => {

const option =
document.createElement("option");

option.value = city;
option.textContent = city;

citySelect.appendChild(option);

});

}

document
.getElementById("fromCountry")
.addEventListener("change", function(){

loadCities("fromCountry","fromCity");

});

document
.getElementById("toCountry")
.addEventListener("change", function(){

loadCities("toCountry","toCity");

});

loadCities("fromCountry","fromCity");
loadCities("toCountry","toCity");

const routes = {

"Kosice-Bratislava":400,
"Kosice-Presov":35,
"Kosice-Zilina":260,
"Kosice-Poprad":115,

"Bratislava-Vieden":80,
"Bratislava-Budapest":200,
"Bratislava-Praha":330,
"Bratislava-Brno":130,

"Praha-Brno":210,
"Praha-Berlin":350,

"Berlin-Hamburg":290,
"Berlin-Frankfurt":550,
"Berlin-Munich":585,

"Budapest-Vieden":243,
"Budapest-Debrecen":230,

"Vieden-Graz":200,
"Vieden-Linz":185,

"Amsterdam-Rotterdam":80,
"Brusel-Amsterdam":210,

"Pariz-Lyon":470,
"Pariz-Marseille":775,

"Milano-Rim":570,
"Warszawa-Krakow":300

};

function getDistance(fromCity,toCity){

const route1 =
fromCity + "-" + toCity;

const route2 =
toCity + "-" + fromCity;

if(routes[route1]){
return routes[route1];
}

if(routes[route2]){
return routes[route2];
}

return 500;

}

function calculatePrice(){

const fromCity =
document.getElementById("fromCity").value;

const toCity =
document.getElementById("toCity").value;

const distance =
getDistance(fromCity,toCity);

const weight =
Number(document.getElementById("weight").value);

const length =
Number(document.getElementById("length").value);

const width =
Number(document.getElementById("width").value);

const height =
Number(document.getElementById("height").value);

const transport =
Number(document.getElementById("transport").value);

const category =
Number(document.getElementById("category").value);

const volume =
(length * width * height) / 1000000;

const price =
(
(distance * transport)
+
(weight * 0.7)
+
(volume * 40)
)
*
category
+
50;

document.getElementById("result").innerHTML =

`<div class="result">

<h2>Výsledok kalkulácie</h2>

<p><strong>Trasa:</strong>
${fromCity} → ${toCity}</p>

<p><strong>Vzdialenosť:</strong>
${distance} km</p>

<p><strong>Objem:</strong>
${volume.toFixed(2)} m³</p>

<p><strong>Hmotnosť:</strong>
${weight} kg</p>

<p class="price">
${price.toFixed(2)} €
</p>

</div>`;

}

</script>
